# Render Blueprint for Nexora Commerce (Bagisto 2.5, Docker).
# Secrets are NOT stored here: every "sync: false" value is entered by you in the
# Render dashboard (Environment tab) when the Blueprint is applied.
services:
  - type: web
    name: nexora-commerce
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Nexora
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false          # e.g. https://nexora-commerce.onrender.com
      - key: APP_KEY
        sync: false          # copy from your local .env (keeps encrypted values valid)
      - key: APP_ADMIN_URL
        value: admin
      - key: APP_LOCALE
        value: ar
      - key: APP_TIMEZONE
        value: Asia/Hebron
      - key: APP_CURRENCY
        value: ILS
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false          # paste the database provider's CA certificate (public, not a password)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: RESPONSE_CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log           # demo store: no real e-mails are sent
      - key: BROADCAST_CONNECTION
        value: "null"
      - key: RUN_MIGRATIONS
        value: "false"
