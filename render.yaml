# Render Blueprint for Nexora Commerce (Bagisto 2.5, Docker) + Render PostgreSQL.
# No secrets live here: APP_KEY is generated by Render and the database URL is
# wired from the Render PostgreSQL instance below.
services:
  - type: web
    name: nexora-commerce
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Nexora
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DEBUGBAR_ENABLED
        value: "false"
      - key: APP_URL
        value: https://nexora-commerce.onrender.com
      - key: APP_KEY
        generateValue: true  # Render creates a random 256-bit key; start.sh adds Laravel's "base64:" prefix
      - key: APP_ADMIN_URL
        value: admin
      - key: APP_LOCALE
        value: ar
      - key: APP_TIMEZONE
        value: Asia/Hebron
      - key: APP_CURRENCY
        value: ILS
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: RESPONSE_CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log           # demo store: no real e-mails are sent
      - key: BROADCAST_CONNECTION
        value: "null"
      - key: RUN_MIGRATIONS
        value: "true"        # "migrate --force" only adds missing tables; never drops or resets

databases:
  - name: nexora-db
    plan: free               # free for 30 days on Render, then it must be upgraded
    region: frankfurt
    databaseName: nexora
    user: nexora
