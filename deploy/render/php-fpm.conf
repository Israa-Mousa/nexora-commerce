[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
; Small instance: few workers, recycled regularly
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 400
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
